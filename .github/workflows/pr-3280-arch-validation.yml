name: pr-3280-arch-validation

on:
  workflow_dispatch:

env:
  GO_VER: "1.25.10"
  PY_VER: "3.10"
  UV_VER: "0.11.23"
  CGO_ENABLED: 0

jobs:
  build-unit-docs:
    name: build-unit-docs (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: amd64
          - runner: ubuntu-24.04-arm
            label: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VER }}

      - name: Cache go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ matrix.label }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.label }}-go-

      - name: Build containerlab
        run: make build-with-podman-debug BINARY=containerlab

      - name: Run focused cEOS unit tests
        run: go test ./nodes/ceos

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VER }}
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Build docs
        run: uv run --group docs zensical build --clean --strict

  ceos-basic-tests:
    name: ceos-basic-tests (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    needs: build-unit-docs
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: amd64
            image: ghcr.io/srl-labs/ceos:4.32.0F
          - runner: ubuntu-24.04-arm
            label: arm64
            image: ghcr.io/srl-labs/ceos:4.33-arm
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VER }}

      - name: Cache go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ matrix.label }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.label }}-go-

      - name: Build containerlab
        run: make build-with-podman-debug BINARY=containerlab

      - name: Move containerlab to usr/bin
        run: sudo mv ./containerlab /usr/bin/containerlab && sudo chown root:root /usr/bin/containerlab && sudo chmod 4755 /usr/bin/containerlab

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VER }}
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Activate virtualenv
        run: |
          . .venv/bin/activate
          echo PATH=$PATH >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull cEOS image for ${{ matrix.label }}
        run: docker pull ${{ matrix.image }} && docker tag ${{ matrix.image }} ceos:4.32.0F

      - name: Run cEOS basic tests
        run: bash ./tests/rf-run.sh docker ./tests/03-basic-ceos

      - name: Upload cEOS test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: 03-basic-ceos-log-${{ matrix.label }}
          path: ./tests/out/*.html
